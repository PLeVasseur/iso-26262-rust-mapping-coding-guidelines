runtime_mode: grounding_only_ws6

ws6_policy:
  active_truth:
    paragraph_resolution: WS7_REQUIRED
    candidate_competition: disabled
    ranking_thresholds: dormant
    ranking_weights: dormant
  notes:
    - WS6 grounding may build only deterministic grounding artifacts and soft priors.
    - WS6 runtime must not treat any ranking-era score threshold or weight as active decision truth.
    - WS7 will replace this dormant placeholder with the declared staged score contract.

ws7_ranking_dormant:
  status: inactive_until_ws7
  prior_config_source: plan_only
