version: 1
source_repo: rustfoundation/safety-critical-rust-coding-guidelines
source_sha: 1c7d6bb9448a25401db3b411d1783cd4e78fc718
tree_path: src/coding-guidelines
default_tier: all
pack_id_prefix: known-good
output_root: benchmarks/known-good
tier_rules:
  strict:
    require_rationale: true
    require_compliant_example: true
    require_non_compliant_example: true
    require_citation_signal: true
    require_bibliography_signal: true
    disallow_todo_signal: true
  extended:
    require_rationale: true
    require_compliant_example: true
    require_non_compliant_example: true
    require_citation_signal: false
    require_bibliography_signal: false
    disallow_todo_signal: true
