    - iter
    - iter_mut
    - into_iter
    - collect
    - map
    - filter
    - fold
  closures:
    - Fn
    - FnMut
    - FnOnce
    - closure
    - move
  collections:
    - Vec
    - HashMap
    - BTreeMap
    - HashSet
    - BTreeSet
    - VecDeque
    - LinkedList
    - BinaryHeap
  string_types:
    - String
    - str
    - CStr
    - CString
    - OsStr
    - OsString
    - Path
    - PathBuf
  io:
    - Read
    - Write
    - BufRead
    - BufReader
    - BufWriter
    - File
    - stdin
    - stdout
    - stderr
  async_runtime:
    - async
    - await
    - Future
    - Poll
    - Waker
    - Pin<Future>
    - tokio
    - async-std
