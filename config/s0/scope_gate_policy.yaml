version: 1
max_families: 2
per_prompt_overrides: {}
families:
  atomics:
    - AtomicBool
    - AtomicUsize
    - AtomicI8
    - AtomicI16
    - AtomicI32
    - AtomicI64
    - AtomicU8
    - AtomicU16
    - AtomicU32
    - AtomicU64
    - AtomicPtr
    - Ordering
    - fence
    - compiler_fence
    - atomic
  concurrency_sync:
    - Mutex
    - RwLock
    - Condvar
    - Barrier
    - Once
    - OnceLock
    - LazyLock
  interior_mutability:
    - Cell
    - RefCell
    - UnsafeCell
    - OnceCell
  smart_pointers:
    - Box
    - Rc
    - Arc
    - Weak
    - Cow
  unsafe_primitives:
    - unsafe
    - raw_pointer
    - NonNull
    - MaybeUninit
    - ManuallyDrop
    - transmute
    - transmute_copy
  pinning:
    - Pin
    - Unpin
    - pin!
  error_handling:
    - Result
    - Option
    - panic
    - unwrap
    - expect
    - unwrap_unchecked
    - unwrap_or
    - unwrap_or_else
  memory_layout:
    - repr
    - align
    - size_of
    - align_of
    - Layout
    - alloc
    - GlobalAlloc
    - Allocator
  traits_generics:
    - Send
    - Sync
