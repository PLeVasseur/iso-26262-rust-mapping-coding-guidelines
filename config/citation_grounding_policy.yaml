version: 1
max_iso_citations_per_guideline: 2
max_std_refs_per_guideline: 3
min_total_markers: 2
max_repeated_anchor_sentences: 1
disallow_generic_anchor_phrase_repeat: true
iso_templates:
  from_seed: ISO26262-Part{part}-{reference}
  fallback: ISO26262-6-2018
std_ref_defaults_by_topic:
  defensive programming & contracts:
    - std::result::Result
    - core::option::Option
  concurrency and shared-state constraints:
    - std::sync::Mutex
    - std::sync::Arc
    - std::sync::atomic
  language subset / forbidden constructs:
    - core::ptr
    - core::mem::MaybeUninit
  type safety & conversions:
    - core::convert::TryFrom
    - core::num
  complexity & structure:
    - core::result::Result
std_ref_fallbacks:
  - std::result::Result
  - core::option::Option
anchor_sentence_templates:
  iso:
    - "ISO traceability anchor: {marker}"
    - "ISO obligation evidence source: {marker}"
    - "ISO requirement linkage: {marker}"
  std:
    - "Rust API constraint anchor: {marker}"
    - "Rust language/library evidence point: {marker}"
    - "Rust semantic anchor for verification: {marker}"
