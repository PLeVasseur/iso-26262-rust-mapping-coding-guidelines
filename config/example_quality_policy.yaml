version: 1
gate_mode: warn
require_expected_outcome: true
documented_only_requires_verification_notes: true
require_assertion_for_assertion_pass: true
allowed_outcomes:
  compliant:
  - assertion_pass
  - documented_only
  non_compliant:
  - compile_fail
  - runtime_panic
  - lint_trigger
  - documented_only
thresholds:
  min_outcome_match_ratio: 0.95
  min_assertion_backed_compliant_ratio: 0.9
  min_negative_evidence_strength_ratio: 0.8
  max_documented_only_ratio: 0.1
  min_unique_example_signature_ratio: 0.7
  max_repeated_example_signature_count: 2
