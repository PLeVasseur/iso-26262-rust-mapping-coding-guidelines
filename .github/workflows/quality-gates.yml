name: Quality Gates

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  static-quality:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install uv
        run: pip install uv

      - name: Sync dependencies
        run: uv sync --frozen

      - name: Ruff format check
        run: uv run ruff format --check .

      - name: Ruff lint
        run: uv run ruff check .

      - name: Validate schemas
        run: uv run python scripts/validate_schemas.py --strict-generated

      - name: Traceability gate
        run: uv run python scripts/check_traceability.py

      - name: Licensing guard
        run: uv run python scripts/check_licensing_guard.py

      - name: Diffset review blocker gate
        run: uv run python scripts/check_diffset_review_gate.py --allow-missing

      - name: Unit tests
        run: uv run python -m unittest discover -s tests/unit -p "test_*.py"

  orchestrate-smoke:
    runs-on: ubuntu-latest
    env:
      EXTRACTOR_REPO_ROOT: ${{ secrets.EXTRACTOR_REPO_ROOT }}
      EXTRACTOR_CACHE_ROOT: ${{ secrets.EXTRACTOR_CACHE_ROOT }}
      EXTRACTOR_MANIFEST_DIR: ${{ secrets.EXTRACTOR_MANIFEST_DIR }}
    if: ${{ env.EXTRACTOR_REPO_ROOT != '' && env.EXTRACTOR_CACHE_ROOT != '' && env.EXTRACTOR_MANIFEST_DIR != '' }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install uv
        run: pip install uv

      - name: Sync dependencies
        run: uv sync --frozen

      - name: Extractor health check
        run: uv run python scripts/check_extractor_health.py --skip-validate

      - name: Bootstrap smoke run
        run: uv run python scripts/bootstrap_session.py --profile quick
