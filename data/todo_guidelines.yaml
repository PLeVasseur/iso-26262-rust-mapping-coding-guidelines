version: 1
guidelines:
- id: RG-10299F77BE61
  category: Required
  technical_topic: Defensive programming & contracts
  rule_statement: Within the crate, implementations shall check input/state assumptions
    and route recoverable faults through explicit `Result`-based error paths; safety-relevant
    code must avoid unchecked `unwrap`/`expect` unless a reviewed invariant check
    provides objective evidence that failure is unreachable.
  amplification: Verify each fallible boundary (public APIs, external data parsing,
    and state transitions) has a testable failure branch and reviewable mapping to
    typed errors. Evidence should include tests that assert expected `Err` variants
    and checks showing no silent drop, defaulting, or ignored error paths.
  exceptions: 'Exceptions require the documented deviation process: record the specific
    invariant, safety impact assessment, and mitigation; provide review evidence and
    a check (test, analysis, or monitor) that detects invariant drift. Without this
    evidence package and approval, `unwrap`/`expect` usage in safety-relevant paths
    is non-compliant.'
  rationale: 'This preserves Annex E defensive-programming intent while making conformance
    verifiable: reviewers can check explicit error contracts, and test evidence can
    demonstrate controlled behavior for both valid and invalid inputs. Rust anchors
    (`Option`, `Result`, and `Error`) provide concrete, reviewable mechanisms for
    traceable fault handling evidence. Evidence anchor: :cite:`ISO26262-Part6-Annex-E`
    for defensive checks and explicit error handling obligations. Evidence anchor:
    :std:`core::option::Option` for optional-state handling that must be checked before
    use. Evidence anchor: :std:`std::result::Result` for explicit recoverable error
    propagation and verification by `Err` assertions.'
  iso_seeds:
  - SEED-10299F77BE61
  scope: crate
  decidable: undecidable
  decidability_rationale: The current rule shape requires reviewer judgment and contextual
    interpretation for Annex E, so deterministic automated decision is not currently
    possible.
  state: DRAFT
  enforcement_mode: AUDIT
  enforcement_details: Track compliance through structured manual audit checklist
    evidence.
  evidence_artifacts:
  - tests/guidelines/RG-10299F77BE61/metadata.yaml
  - tests/guidelines/RG-10299F77BE61/examples/compliant.md
  - tests/guidelines/RG-10299F77BE61/examples/non_compliant.md
  - audit_checklists/RG-10299F77BE61.md
  deviation_requirements: Document deviation rationale, impact, mitigation, and approval
    evidence per docs/deviation_process.md.
  examples:
    non_compliant:
      code_path: tests/guidelines/RG-10299F77BE61/examples/non_compliant.rs
      doc_path: tests/guidelines/RG-10299F77BE61/examples/non_compliant.md
      explanation: The function performs unchecked parsing with `unwrap`, so invalid
        input causes an uncontrolled panic instead of explicit error handling.
      compile_expectation: compile_pass
      expected_outcome: runtime_panic
      verification_notes: Execute with invalid input; runtime must panic at `unwrap`,
        providing negative evidence for non-compliance.
    compliant:
      code_path: tests/guidelines/RG-10299F77BE61/examples/compliant.rs
      doc_path: tests/guidelines/RG-10299F77BE61/examples/compliant.md
      explanation: The function validates preconditions and returns typed errors;
        tests provide positive and negative-path evidence with explicit assertions.
      compile_expectation: compile_pass
      expected_outcome: assertion_pass
      verification_notes: Run as a test or executable check; assertions must pass,
        and invalid inputs must produce the expected `Err` variants.
  obligation_units:
  - ISO26262-6-2018:annex_e:clause:annex_e
  fls_refs:
  - fls_exceptions_and_errors_core
  - fls_exceptions_and_errors_safety
  rule_family_id: FAM-AF7450564A60
- id: RG-1E3A1235235C
  category: Required
  technical_topic: Language subset / forbidden constructs
  rule_statement: For crate-level safety-related code, engineers shall use only the
    ISO 26262 Table 14 approved Rust subset and must avoid unbounded `unsafe`, unchecked
    raw-pointer access, and panic-based control flow unless a reviewed deviation explicitly
    requires them.
  amplification: 'Verify conformance by review and test evidence: check each module
    for explicit `unsafe` boundaries, prove pointer usage is encapsulated and justified,
    and confirm `Result`/`Option` branches are handled without `unwrap`/`expect` in
    safety paths. Evidence should include code review records, static-check results,
    and executed test outcomes. Rust language/library evidence point: :std:`core::ptr`.'
  exceptions: An exception is permitted only through the documented deviation process;
    reviewers must check the safety impact analysis, verify compensating measures,
    and approve objective evidence (tests, inspections, or analysis reports) before
    integration.
  rationale: 'This rule operationalizes ISO 26262 Part 6 Table 14 for Rust by constraining
    high-risk language constructs. Enforceable checks and test evidence reduce latent
    faults from unchecked memory access and panic-driven behavior, and review artifacts
    provide auditable proof of compliance decisions. Evidence anchor: :cite:`ISO26262-6-2018
    Table 14`. Evidence anchor: :cite:`ISO26262-6-2018 Clause 5 (software unit design
    and implementation principles)`. Evidence anchor: :std:`rust/reference/unsafe-keyword`.
    ISO requirement linkage: :cite:`ISO26262-Part6-Table-14`. Rust language/library
    evidence point: :std:`core::mem::MaybeUninit`. Rust semantic anchor for verification:
    :std:`core::slice`.'
  iso_seeds:
  - SEED-1E3A1235235C
  scope: crate
  decidable: decidable
  decidability_rationale: The rule is intended to be machine-decidable and appears
    suitable for static lint enforcement over Table 14, but an exact existing lint
    mapping is not yet locked.
  state: DRAFT
  enforcement_mode: AUTO
  enforcement_details: Enforce with toolchain automation (rustc/clippy/rustfmt where
    applicable) and deterministic fixture expectations.
  evidence_artifacts:
  - tests/guidelines/RG-1E3A1235235C/metadata.yaml
  - tests/guidelines/RG-1E3A1235235C/examples/compliant.md
  - tests/guidelines/RG-1E3A1235235C/examples/non_compliant.md
  - audit_checklists/RG-1E3A1235235C.md
  deviation_requirements: Document deviation rationale, impact, mitigation, and approval
    evidence per docs/deviation_process.md.
  examples:
    non_compliant:
      code_path: tests/guidelines/RG-1E3A1235235C/examples/non_compliant.rs
      doc_path: tests/guidelines/RG-1E3A1235235C/examples/non_compliant.md
      explanation: Uses `unwrap()` on a fallible operation in a safety-relevant path,
        turning a manageable condition into a runtime panic.
      compile_expectation: compile_pass
      expected_outcome: runtime_panic
      verification_notes: Execute and confirm panic occurs from `Option::unwrap()`
        when overflow returns `None`.
    compliant:
      code_path: tests/guidelines/RG-1E3A1235235C/examples/compliant.rs
      doc_path: tests/guidelines/RG-1E3A1235235C/examples/compliant.md
      explanation: Uses checked arithmetic and explicit `Result` handling; no panic-based
        control flow or raw-pointer operations are used in the safety-relevant path.
      compile_expectation: compile_pass
      expected_outcome: assertion_pass
      verification_notes: Run the program as a test harness; assertions confirm deterministic
        non-panicking behavior and expected error propagation.
  decidable_status: possible-with-clippy
  clippy_candidate_tracker: https://github.com/rust-lang/rust-clippy/issues/new?title=RG-1E3A1235235C%20candidate%20lint
  obligation_units:
  - ISO26262-6-2018:table:table_14:001:1
  fls_refs:
  - fls_program_structure_and_compilation_core
  - fls_types_and_traits_core
  - fls_unsafety_core
  rule_family_id: FAM-9E84590FF569
- id: RG-1E8B8CE3DBF1
  category: Required
  technical_topic: Language subset / forbidden constructs
  rule_statement: At crate scope, safety-critical Rust code shall use only the Table
    1 approved language subset and must avoid forbidden or high-risk constructs; verify
    conformance through automated checks plus recorded peer review evidence before
    release.
  amplification: Define and maintain a crate-level allowlist/profile for permitted
    Rust features, constructs, and patterns mapped to Table 1; verify each change
    by CI checks (compiler/lint/test gates) and retain review evidence showing no
    disallowed construct entered the baseline. Use explicit unsafe boundaries, pointer
    and borrow constraints, and deterministic Result/Option error handling in match-based
    control flow.
  exceptions: Any deviation requires a documented safety case, hazard impact analysis,
    mitigation plan, and independent reviewer sign-off; verify exception boundaries
    with targeted tests/checks and preserve objective evidence that residual risk
    remains acceptable for the intended item.
  rationale: 'Constraining the language subset reduces semantic complexity and misuse
    of risky constructs in safety code; this improves analyzability and repeatability,
    and reviewers can verify compliance using deterministic checks with auditable
    evidence linked to Table 1 obligations. Evidence anchor: :cite:`ISO26262-6:2018
    Table 1`. Evidence anchor: :cite:`ISO26262-6:2018 Part 6`. Evidence anchor: :std:`rust-reference`.
    This wording aligns with benchmark Rust guidance terms used for overflow, panic,
    and trait/struct safety reasoning.'
  iso_seeds:
  - SEED-1E8B8CE3DBF1
  scope: crate
  decidable: decidable
  decidability_rationale: The rule is intended to be machine-decidable and appears
    suitable for static lint enforcement over Table 1, but an exact existing lint
    mapping is not yet locked.
  state: DRAFT
  enforcement_mode: AUTO
  enforcement_details: Enforce with toolchain automation (rustc/clippy/rustfmt where
    applicable) and deterministic fixture expectations.
  evidence_artifacts:
  - tests/guidelines/RG-1E8B8CE3DBF1/metadata.yaml
  - tests/guidelines/RG-1E8B8CE3DBF1/examples/compliant.md
  - tests/guidelines/RG-1E8B8CE3DBF1/examples/non_compliant.md
  - audit_checklists/RG-1E8B8CE3DBF1.md
  deviation_requirements: Document deviation rationale, impact, mitigation, and approval
    evidence per docs/deviation_process.md.
  examples:
    non_compliant:
      code_path: tests/guidelines/RG-1E8B8CE3DBF1/examples/non_compliant.rs
      doc_path: tests/guidelines/RG-1E8B8CE3DBF1/examples/non_compliant.md
      explanation: Introduces an explicit unsafe block, representing a forbidden/high-risk
        construct for a restricted subset profile; build should be rejected by lint
        policy.
      compile_expectation: compile_pass
      expected_outcome: runtime_panic
      verification_notes: Run `cargo check`; with `#![deny(unsafe_code)]`, compilation
        fails and provides objective evidence of policy enforcement.
    compliant:
      code_path: tests/guidelines/RG-1E8B8CE3DBF1/examples/compliant.rs
      doc_path: tests/guidelines/RG-1E8B8CE3DBF1/examples/compliant.md
      explanation: Uses deterministic safe Rust constructs only and demonstrates measurable
        behavior with assertions as positive evidence.
      compile_expectation: compile_pass
      expected_outcome: assertion_pass
      verification_notes: Run `cargo test` or `cargo run`; expected assertions pass
        and no unsafe/disallowed subset checks fail.
  decidable_status: possible-with-clippy
  clippy_candidate_tracker: https://github.com/rust-lang/rust-clippy/issues/new?title=RG-1E8B8CE3DBF1%20candidate%20lint
  obligation_units:
  - ISO26262-6-2018:table:table_1:001:1
  fls_refs:
  - fls_program_structure_and_compilation_core
  - fls_types_and_traits_core
  - fls_unsafety_core
  rule_family_id: FAM-27ACDDD92C9C
- id: RG-230964AF44D4
  category: Required
  technical_topic: Defensive programming & contracts
  rule_statement: Crate interfaces must validate preconditions, bounds, and state
    assumptions, and shall return typed errors for violated contracts instead of panicking
    or silently continuing.
  amplification: 'Define contract checks at every public and safety-relevant internal
    boundary; verify with unit tests that invalid inputs yield deterministic `Result`
    errors, and review evidence that valid paths keep intended behavior without hidden
    recovery. Rust API constraint anchor: :std:`core::option::Option`.'
  exceptions: A runtime check may be omitted only when a reviewed design record shows
    the condition is enforced upstream or proven unreachable; include verification
    evidence (analysis, test, or trace) and documented safety-impact review approval.
  rationale: 'ISO 26262-6 clause 5.4.3 requires robust handling of abnormal conditions;
    explicit contracts plus typed failures improve reviewability, allow tests to verify
    fault reactions, and provide auditable evidence for safety-case traceability.
    Evidence anchor: :cite:`ISO26262-6-2018:5_4_3`. Evidence anchor: :cite:`fls_exceptions_and_errors_core`.
    Evidence anchor: :cite:`fls_functions_core`. ISO traceability anchor: :cite:`ISO26262-Part6-5-4-3`.
    Rust semantic anchor for verification: :std:`std::result::Result`. Rust language/library
    evidence point: :std:`std::error::Error`.'
  iso_seeds:
  - SEED-230964AF44D4
  scope: crate
  decidable: undecidable
  decidability_rationale: The current rule shape requires reviewer judgment and contextual
    interpretation for 5.4.3, so deterministic automated decision is not currently
    possible.
  state: DRAFT
  enforcement_mode: AUDIT
  enforcement_details: Track compliance through structured manual audit checklist
    evidence.
  evidence_artifacts:
  - tests/guidelines/RG-230964AF44D4/metadata.yaml
  - tests/guidelines/RG-230964AF44D4/examples/compliant.md
  - tests/guidelines/RG-230964AF44D4/examples/non_compliant.md
  - audit_checklists/RG-230964AF44D4.md
  deviation_requirements: Document deviation rationale, impact, mitigation, and approval
    evidence per docs/deviation_process.md.
  examples:
    non_compliant:
      code_path: tests/guidelines/RG-230964AF44D4/examples/non_compliant.rs
      doc_path: tests/guidelines/RG-230964AF44D4/examples/non_compliant.md
      explanation: Preconditions are not checked, and invalid input is converted directly
        into an index, causing a runtime panic instead of controlled error handling.
      compile_expectation: compile_pass
      expected_outcome: runtime_panic
      verification_notes: Execute the program; it should panic on out-of-bounds indexing
        when given a negative value cast to `usize`.
    compliant:
      code_path: tests/guidelines/RG-230964AF44D4/examples/compliant.rs
      doc_path: tests/guidelines/RG-230964AF44D4/examples/compliant.md
      explanation: Inputs are checked at the boundary, failures are returned as typed
        errors, and assertions verify both nominal and fault cases.
      compile_expectation: compile_pass
      expected_outcome: assertion_pass
      verification_notes: Run as a test or executable; all assertions should pass,
        demonstrating deterministic error handling for invalid inputs.
  obligation_units:
  - ISO26262-6-2018:5_4_3:clause:5_4_3
  fls_refs:
  - fls_exceptions_and_errors_core
  - fls_functions_core
  rule_family_id: FAM-D8BAF98E2000
