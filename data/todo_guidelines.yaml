version: 1
guidelines:
- id: RG-10299F77BE61
  category: Required
  technical_topic: Defensive programming & contracts
  rule_statement: At crate scope, constrain error propagation and failure handling
    to approved patterns and reject ambiguous or implicit behavior in safety-critical
    Rust code.
  amplification: Apply this rule to Defensive programming & contracts decisions with
    explicit preconditions, invariant checks, and objective review evidence. Document
    permitted and forbidden coding patterns. Use explicit unsafe boundaries, pointer
    and borrow constraints, and deterministic Result/Option error handling in match-based
    control flow.
  exceptions: Exceptions require documented hazard impact analysis, mitigation evidence,
    and independent reviewer approval before merge.
  rationale: 'Constraining error propagation and failure handling reduces latent faults
    and improves deterministic behavior needed for ISO 26262 compliance evidence.
    This wording aligns with benchmark Rust guidance terms used for overflow, panic,
    and trait/struct safety reasoning. Safety evidence anchor: :cite:`ISO26262-6-2018`.
    Safety evidence anchor: :cite:`ISO26262-8-2018`. Rust API reference anchor: :std:`std::result::Result`.
    Rust API reference anchor: :std:`core::option::Option`.'
  iso_seeds:
  - SEED-10299F77BE61
  scope: crate
  decidable: undecidable
  decidability_rationale: The current rule shape requires reviewer judgment and contextual
    interpretation for Annex E, so deterministic automated decision is not currently
    possible.
  state: DRAFT
  enforcement_mode: AUDIT
  enforcement_details: Track compliance through structured manual audit checklist
    evidence.
  evidence_artifacts:
  - tests/guidelines/RG-10299F77BE61/metadata.yaml
  - tests/guidelines/RG-10299F77BE61/examples/compliant.md
  - tests/guidelines/RG-10299F77BE61/examples/non_compliant.md
  - audit_checklists/RG-10299F77BE61.md
  deviation_requirements: Document deviation rationale, impact, mitigation, and approval
    evidence per docs/deviation_process.md.
  examples:
    non_compliant:
      code_path: tests/guidelines/RG-10299F77BE61/examples/non_compliant.rs
      doc_path: tests/guidelines/RG-10299F77BE61/examples/non_compliant.md
      explanation: This example intentionally violates the guideline intent and should
        be used as negative evidence during rule validation.
      compile_expectation: documented-only
    compliant:
      code_path: tests/guidelines/RG-10299F77BE61/examples/compliant.rs
      doc_path: tests/guidelines/RG-10299F77BE61/examples/compliant.md
      explanation: This example demonstrates a compliant coding pattern aligned with
        the guideline intent and should be used as positive evidence during rule validation.
      compile_expectation: documented-only
  obligation_units:
  - ISO26262-6-2018:annex_e:clause:annex_e
  fls_refs:
  - fls_exceptions_and_errors_core
  - fls_exceptions_and_errors_safety
  rule_family_id: FAM-AF7450564A60
