  amplification: 'Initial generic guideline derived from ISO 26262 seed SEED-697000BF3263
    (Part 6 Table 7). This rule is expected to be decomposed into narrower Rust-specific
    sub-guidelines as corpus evidence grows. Use explicit unsafe boundaries, pointer
    and borrow constraints, and deterministic Result/Option error handling in match-based
    control flow. Rust API constraint anchor: :std:`core::mem::MaybeUninit`.'
  exceptions: Exception allowed only through the documented deviation process with
    explicit safety impact assessment, mitigation evidence, and reviewer approval.
  rationale: 'Derived from ISO 26262 seed SEED-697000BF3263 (Part 6 Table 7) to maintain
    traceable coding-guideline coverage. This wording aligns with benchmark Rust guidance
    terms used for overflow, panic, and trait/struct safety reasoning. ISO obligation
    evidence source: :cite:`ISO26262-Part6-Table-7`. Rust language/library evidence
