version: 1
guidelines:
- id: RG-10299F77BE61
  category: Required
  technical_topic: Defensive programming & contracts
  rule_statement: Within crate-level interfaces and safety-relevant execution paths,
    implementations shall check preconditions and encode recoverable faults with explicit
    `Result`/`Option` handling so reviewers and tests can verify deterministic failure
    behavior aligned to Annex E.
  amplification: Use explicit contracts at function boundaries (input range, state
    validity, and invariant checks) and propagate failures via typed errors instead
    of implicit fallthrough. Verify conformance by code review of error paths and
    by tests that check both success assertions and defined failure outcomes. Prefer
    Rust constructs that make evidence auditable, such as :std:`std::result::Result`,
    :std:`core::option::Option`, and explicit pattern matching.
  exceptions: An exception is permitted only through a documented deviation that includes
    safety impact analysis, mitigation evidence, and independent reviewer approval.
    The deviation record must define how equivalent checks are verified (for example,
    targeted tests, static checks, or review checklists) and retain objective evidence
    for audit.
  rationale: 'Annex E requires defensive behavior and explicit fault handling for
    safety-related software; making contracts and error transitions explicit improves
    traceability and testability. This rule supports objective evidence generation
    by requiring checkable outcomes in tests and review artifacts, with Rust error
    types providing concrete, reviewable mechanisms (:std:`std::result::Result`, :std:`std::error::Error`;
    :cite:`ISO26262-Part6-Annex-E`). Evidence anchor: :cite:`ISO26262-Part6-Annex-E`
    for defensive programming and error-handling obligation traceability.. Evidence
    anchor: :std:`std::result::Result` to ground explicit recoverable-failure propagation..
    Evidence anchor: :std:`core::option::Option` to ground explicit absence handling
    without unchecked assumptions..'
  iso_seeds:
  - SEED-10299F77BE61
  scope: crate
  decidable: undecidable
  decidability_rationale: The current rule shape requires reviewer judgment and contextual
    interpretation for Annex E, so deterministic automated decision is not currently
    possible.
  state: DRAFT
  enforcement_mode: AUDIT
  enforcement_details: Track compliance through structured manual audit checklist
    evidence.
  evidence_artifacts:
  - tests/guidelines/RG-10299F77BE61/metadata.yaml
  - tests/guidelines/RG-10299F77BE61/examples/compliant.md
  - tests/guidelines/RG-10299F77BE61/examples/non_compliant.md
  - audit_checklists/RG-10299F77BE61.md
  deviation_requirements: Document deviation rationale, impact, mitigation, and approval
    evidence per docs/deviation_process.md.
  examples:
    non_compliant:
      code_path: tests/guidelines/RG-10299F77BE61/examples/non_compliant.rs
      doc_path: tests/guidelines/RG-10299F77BE61/examples/non_compliant.md
      explanation: The function omits defensive checks and uses `unwrap` on an impossible
        assumption, causing a runtime panic instead of explicit error handling.
      compile_expectation: compile_pass
      expected_outcome: runtime_panic
      verification_notes: Executing the test should panic at runtime due to `unwrap()`
        on `None`, demonstrating non-compliant failure handling.
    compliant:
      code_path: tests/guidelines/RG-10299F77BE61/examples/compliant.rs
      doc_path: tests/guidelines/RG-10299F77BE61/examples/compliant.md
      explanation: The function validates input and returns typed errors instead of
        panicking; tests verify both nominal and failure behavior with assertions.
      compile_expectation: compile_pass
      expected_outcome: assertion_pass
      verification_notes: Run as tests; all assertions should pass and no panic should
        occur.
  obligation_units:
  - ISO26262-6-2018:annex_e:clause:annex_e
  fls_refs:
  - fls_exceptions_and_errors_core
  - fls_exceptions_and_errors_safety
  rule_family_id: FAM-AF7450564A60
