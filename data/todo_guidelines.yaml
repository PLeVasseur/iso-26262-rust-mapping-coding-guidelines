- id: RG-1E8B8CE3DBF1
  category: Required
  technical_topic: Language subset / forbidden constructs
  rule_statement: At crate scope, safety-critical Rust code shall use only the Table
    1 approved language subset and must avoid forbidden or high-risk constructs; verify
    conformance through automated checks plus recorded peer review evidence before
    release.
  amplification: Define and maintain a crate-level allowlist/profile for permitted
    Rust features, constructs, and patterns mapped to Table 1; verify each change
    by CI checks (compiler/lint/test gates) and retain review evidence showing no
    disallowed construct entered the baseline. Use explicit unsafe boundaries, pointer
    and borrow constraints, and deterministic Result/Option error handling in match-based
    control flow.
  exceptions: Any deviation requires a documented safety case, hazard impact analysis,
    mitigation plan, and independent reviewer sign-off; verify exception boundaries
    with targeted tests/checks and preserve objective evidence that residual risk
    remains acceptable for the intended item.
  rationale: 'Constraining the language subset reduces semantic complexity and misuse
    of risky constructs in safety code; this improves analyzability and repeatability,
    and reviewers can verify compliance using deterministic checks with auditable
    evidence linked to Table 1 obligations. Evidence anchor: :cite:`ISO26262-6:2018
    Table 1`. Evidence anchor: :cite:`ISO26262-6:2018 Part 6`. Evidence anchor: :std:`rust-reference`.
    This wording aligns with benchmark Rust guidance terms used for overflow, panic,
    and trait/struct safety reasoning.'
  iso_seeds:
  - SEED-1E8B8CE3DBF1
  scope: crate
  decidable: decidable
  decidability_rationale: The rule is intended to be machine-decidable and appears
    suitable for static lint enforcement over Table 1, but an exact existing lint
    mapping is not yet locked.
  state: DRAFT
  enforcement_mode: AUTO
  enforcement_details: Enforce with toolchain automation (rustc/clippy/rustfmt where
    applicable) and deterministic fixture expectations.
  evidence_artifacts:
  - tests/guidelines/RG-1E8B8CE3DBF1/metadata.yaml
  - tests/guidelines/RG-1E8B8CE3DBF1/examples/compliant.md
  - tests/guidelines/RG-1E8B8CE3DBF1/examples/non_compliant.md
  - audit_checklists/RG-1E8B8CE3DBF1.md
  deviation_requirements: Document deviation rationale, impact, mitigation, and approval
    evidence per docs/deviation_process.md.
  examples:
    non_compliant:
      code_path: tests/guidelines/RG-1E8B8CE3DBF1/examples/non_compliant.rs
      doc_path: tests/guidelines/RG-1E8B8CE3DBF1/examples/non_compliant.md
      explanation: Introduces an explicit unsafe block, representing a forbidden/high-risk
        construct for a restricted subset profile; build should be rejected by lint
        policy.
      compile_expectation: compile_pass
      expected_outcome: runtime_panic
      verification_notes: Run `cargo check`; with `#![deny(unsafe_code)]`, compilation
        fails and provides objective evidence of policy enforcement.
    compliant:
      code_path: tests/guidelines/RG-1E8B8CE3DBF1/examples/compliant.rs
      doc_path: tests/guidelines/RG-1E8B8CE3DBF1/examples/compliant.md
      explanation: Uses deterministic safe Rust constructs only and demonstrates measurable
        behavior with assertions as positive evidence.
      compile_expectation: compile_pass
      expected_outcome: assertion_pass
      verification_notes: Run `cargo test` or `cargo run`; expected assertions pass
        and no unsafe/disallowed subset checks fail.
  decidable_status: possible-with-clippy
  clippy_candidate_tracker: https://github.com/rust-lang/rust-clippy/issues/new?title=RG-1E8B8CE3DBF1%20candidate%20lint
  obligation_units:
  - ISO26262-6-2018:table:table_1:001:1
  fls_refs:
  - fls_program_structure_and_compilation_core
  - fls_types_and_traits_core
  - fls_unsafety_core
  rule_family_id: FAM-27ACDDD92C9C
