    example: `#![forbid(unsafe_code)]`, explicit banned APIs, and lint gates), then
    verify compliance through CI checks, test results, and review evidence that no
    excluded construct remains. Use explicit unsafe boundaries, pointer and borrow
    constraints, and deterministic Result/Option error handling in match-based control
    flow.'
