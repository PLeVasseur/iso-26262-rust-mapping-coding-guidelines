- id: RG-230964AF44D4
  category: Required
  technical_topic: Defensive programming & contracts
  rule_statement: Each crate shall validate externally sourced inputs and preconditions
    at API boundaries, then return typed `Result` errors with deterministic handling
    paths instead of unchecked panic-based control flow.
  amplification: 'Implement boundary checks for range, format, and state assumptions
    before internal processing; verify via unit tests that valid inputs succeed and
    invalid inputs produce specific error variants, and review evidence that panic
    paths are not required for normal fault handling. Rust API constraint anchor:
    :std:`core::option::Option`.'
  exceptions: Any deviation must be recorded through the approved safety-deviation
    process; include reviewer-approved impact analysis, mitigation test evidence,
    and a check plan proving residual risk is acceptable for the affected crate boundary.
  rationale: 'ISO 26262-6:2018 clause 5.4.3 expects systematic handling of abnormal
    conditions; explicit precondition validation plus typed error propagation improves
    reviewability, enables repeatable verification evidence, and reduces latent fault
    escalation from implicit or ad hoc failure behavior. Evidence anchor: :std:`ISO
    26262-6:2018, 5.4.3`. Evidence anchor: :cite:`fls_exceptions_and_errors_core`.
    Evidence anchor: :cite:`fls_functions_core`. ISO traceability anchor: :cite:`ISO26262-Part6-5-4-3`.
    Rust semantic anchor for verification: :std:`std::result::Result`. Rust language/library
    evidence point: :std:`std::error::Error`.'
  iso_seeds:
  - SEED-230964AF44D4
  scope: crate
  decidable: undecidable
  decidability_rationale: The current rule shape requires reviewer judgment and contextual
    interpretation for 5.4.3, so deterministic automated decision is not currently
    possible.
  state: DRAFT
  enforcement_mode: AUDIT
  enforcement_details: Track compliance through structured manual audit checklist
    evidence.
  evidence_artifacts:
  - tests/guidelines/RG-230964AF44D4/metadata.yaml
  - tests/guidelines/RG-230964AF44D4/examples/compliant.md
  - tests/guidelines/RG-230964AF44D4/examples/non_compliant.md
  - audit_checklists/RG-230964AF44D4.md
  deviation_requirements: Document deviation rationale, impact, mitigation, and approval
    evidence per docs/deviation_process.md.
  examples:
    non_compliant:
      code_path: tests/guidelines/RG-230964AF44D4/examples/non_compliant.rs
      doc_path: tests/guidelines/RG-230964AF44D4/examples/non_compliant.md
      explanation: Input and preconditions are not handled through typed errors; `unwrap()`
        causes panic on malformed external data.
      compile_expectation: compile_pass
      expected_outcome: runtime_panic
      verification_notes: Execute with malformed input path shown below; verify panic
        occurs due to unchecked `unwrap` rather than controlled error return.
    compliant:
      code_path: tests/guidelines/RG-230964AF44D4/examples/compliant.rs
      doc_path: tests/guidelines/RG-230964AF44D4/examples/compliant.md
      explanation: Boundary input is checked, failures are mapped to typed errors,
        and assertions verify deterministic outcomes without panic-driven control
        flow.
      compile_expectation: compile_pass
      expected_outcome: assertion_pass
      verification_notes: Run as a normal Rust program or test; check that all assertions
        pass and returned error variants match expectations.
  obligation_units:
  - ISO26262-6-2018:5_4_3:clause:5_4_3
  fls_refs:
  - fls_exceptions_and_errors_core
  - fls_functions_core
  rule_family_id: FAM-D8BAF98E2000
- id: RG-262BBEC1A2A9
  category: Required
  technical_topic: Defensive programming & contracts
  rule_statement: Crate code shall validate externally supplied inputs and critical
    state assumptions, and must route all detectable failure conditions through explicit
    `Result`-based or documented fail-safe handling paths before side effects occur.
  amplification: 'During implementation and review, verify that each boundary-facing
    function has explicit precondition checks and that every identified fault source
    is mapped to a typed error, controlled panic policy, or fail-safe action. Evidence
    should include unit tests for nominal, invalid, and boundary inputs, with checks
    showing safety-relevant state is unchanged on error paths. Rust API constraint
    anchor: :std:`core::option::Option`.'
  exceptions: 'An exception is permitted only through the formal deviation process:
    document why the check is infeasible or redundant, provide safety-impact evidence,
    and complete independent review approval. The deviation record must define a verification
    check (test, analysis, or monitor) that demonstrates equivalent or stronger fault
    detection and handling.'
  rationale: 'Defensive contracts plus explicit error paths limit fault propagation
    and make abnormal behavior predictable. This structure lets assessors verify traceability
    from hazard assumptions to code behavior and review objective evidence that failures
    are detected, contained, and handled in line with ISO 26262-6:5.3. Evidence anchor:
    :std:`ISO 26262-6:2018 Clause 5.3`. Evidence anchor: :cite:`rust-book.ch09-error-handling`.
    Evidence anchor: :cite:`rust-reference.panic`. ISO traceability anchor: :cite:`ISO26262-Part6-5-3`.
    Rust language/library evidence point: :std:`std::result::Result`. Rust language/library
    evidence point: :std:`std::error::Error`.'
  iso_seeds:
  - SEED-262BBEC1A2A9
  scope: crate
  decidable: undecidable
  decidability_rationale: The current rule shape requires reviewer judgment and contextual
    interpretation for 5.3, so deterministic automated decision is not currently possible.
  state: DRAFT
  enforcement_mode: AUDIT
  enforcement_details: Track compliance through structured manual audit checklist
    evidence.
  evidence_artifacts:
  - tests/guidelines/RG-262BBEC1A2A9/metadata.yaml
  - tests/guidelines/RG-262BBEC1A2A9/examples/compliant.md
  - tests/guidelines/RG-262BBEC1A2A9/examples/non_compliant.md
  - audit_checklists/RG-262BBEC1A2A9.md
  deviation_requirements: Document deviation rationale, impact, mitigation, and approval
    evidence per docs/deviation_process.md.
  examples:
    non_compliant:
      code_path: tests/guidelines/RG-262BBEC1A2A9/examples/non_compliant.rs
      doc_path: tests/guidelines/RG-262BBEC1A2A9/examples/non_compliant.md
      explanation: The function uses `unwrap()` on external input and crashes instead
        of providing explicit error handling evidence.
      compile_expectation: compile_pass
      expected_outcome: runtime_panic
      verification_notes: Executing this program panics at runtime when `None` is
        provided, demonstrating an uncontrolled failure path.
    compliant:
      code_path: tests/guidelines/RG-262BBEC1A2A9/examples/compliant.rs
      doc_path: tests/guidelines/RG-262BBEC1A2A9/examples/compliant.md
      explanation: The function enforces an input contract and returns a typed error
        instead of panicking; tests assert both success and fault behavior.
      compile_expectation: compile_pass
      expected_outcome: assertion_pass
      verification_notes: Run as a unit test or executable; assertions verify correct
        value on valid input and explicit error on missing input.
  obligation_units:
  - ISO26262-6-2018:5_3:clause:5_3
  fls_refs:
  - fls_exceptions_and_errors_core
  - fls_functions_core
  rule_family_id: FAM-4A594C2B1736
- id: RG-34FDD6EFE8ED
  category: Required
  technical_topic: Defensive programming & contracts
  rule_statement: Within a crate, implementations shall validate assumptions before
    use and route detectable failures through explicit `Result`-based handling; avoid
    unchecked `unwrap`/`expect` unless a reviewed safety argument provides test evidence
    that the failing state is unreachable.
  amplification: For each public API and internal safety-relevant branch, define precondition
    checks, map error causes to typed variants, and verify behavior with positive
    and negative tests. Compliance evidence should include review records showing
    where checks occur and how each failure path is exercised.
  exceptions: A deviation is permitted only when a documented safety case shows the
    failure mode is impossible or externally mitigated; reviewers must check the argument,
    verify linked assumptions, and record objective evidence (analysis, test results,
    and approval) before acceptance.
  rationale: 'ISO 26262-6:7.4.12 expects systematic defensive behavior and explicit
    fault handling. Requiring checkable preconditions and explicit error propagation
    improves diagnosability and prevents silent unsafe continuation; reviewers can
    verify conformance from code review evidence and reproducible test outcomes. Evidence
    anchor: :cite:`ISO26262-Part6-7-4-12`. Evidence anchor: :std:`core::result::Result`.
    Evidence anchor: :std:`core::option::Option`.'
  iso_seeds:
