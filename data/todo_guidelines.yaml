    repeatable verification; build checks, tests, and review evidence demonstrate
    that Table 10 obligations are satisfied without relying on informal judgment.
    Evidence anchor: :std:`ISO26262-6:2018 Table 10`. Evidence anchor: :cite:`rust-reference-unsafe-and-ffi`.
    Evidence anchor: :cite:`rustc-lint-forbid-unsafe-code`. This wording aligns with
    benchmark Rust guidance terms used for overflow, panic, and trait/struct safety
    reasoning.'
