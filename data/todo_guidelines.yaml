- id: RG-697000BF3263
  category: Required
  technical_topic: Tooling, compliance evidence, and deviations
  rule_statement: Each crate shall maintain a reviewable Table 7 compliance evidence
    index that maps every applicable activity to reproducible artifacts and a recorded
    safety reviewer decision.
  amplification: 'Verification must check index completeness and traceability: for
    each mapped Table 7 activity, reviewers can locate artifact identifiers (for example
    test reports, analysis logs, or review records), reproduce the referenced check/test,
    and confirm the evidence still matches current code and configuration. Use explicit
    unsafe boundaries, pointer and borrow constraints, and deterministic Result/Option
    error handling in match-based control flow. Rust API constraint anchor: :std:`core::mem::MaybeUninit`.'
  exceptions: An exception is allowed only through the documented deviation workflow;
    approval requires a safety-impact review, documented mitigation, and objective
    evidence review showing that the missing or delayed Table 7 artifact does not
    invalidate the compliance claim.
  rationale: 'Table 7 obligations need auditable proof, not informal statements. A
    crate-level evidence index enables repeatable review, objective compliance checks,
    and durable evidence continuity when tooling, type/trait usage, or unsafety-related
    implementation details change. Evidence anchor: :std:`ISO 26262-6:2018, Table
    7` for required software-unit activities and work products.. Evidence anchor:
    :cite:`iso26262_table7_activity_traceability` for mapping each activity to objective
    evidence artifacts.. Evidence anchor: :cite:`rust-book-ch11-automated-tests` for
    reproducible Rust test evidence generation.. This wording aligns with benchmark
    Rust guidance terms used for overflow, panic, and trait/struct safety reasoning.
    ISO obligation evidence source: :cite:`ISO26262-Part6-Table-7`. Rust language/library
    evidence point: :std:`core::ptr`. Rust language/library evidence point: :std:`core::slice`.'
  iso_seeds:
  - SEED-697000BF3263
  scope: crate
  decidable: undecidable
  decidability_rationale: The current rule shape requires reviewer judgment and contextual
    interpretation for Table 7, so deterministic automated decision is not currently
    possible.
  state: DRAFT
  enforcement_mode: AUDIT
  enforcement_details: Track compliance through structured manual audit checklist
    evidence.
  evidence_artifacts:
  - tests/guidelines/RG-697000BF3263/metadata.yaml
  - tests/guidelines/RG-697000BF3263/examples/compliant.md
  - tests/guidelines/RG-697000BF3263/examples/non_compliant.md
  - audit_checklists/RG-697000BF3263.md
  deviation_requirements: Document deviation rationale, impact, mitigation, and approval
    evidence per docs/deviation_process.md.
  examples:
    non_compliant:
      code_path: tests/guidelines/RG-697000BF3263/examples/non_compliant.rs
      doc_path: tests/guidelines/RG-697000BF3263/examples/non_compliant.md
      explanation: The crate claims a required Table 7 activity but omits its evidence
        entry; verification panics when mapping is checked.
      compile_expectation: compile_pass
      expected_outcome: runtime_panic
      verification_notes: Run `rustc non_compliant.rs && ./non_compliant`; expected
        result is panic with message indicating missing Table 7 evidence entry.
    compliant:
      code_path: tests/guidelines/RG-697000BF3263/examples/compliant.rs
      doc_path: tests/guidelines/RG-697000BF3263/examples/compliant.md
      explanation: The crate defines required Table 7 activities and verifies every
        activity has a reproducible artifact path and reviewer approval; all assertions
        pass.
      compile_expectation: compile_pass
      expected_outcome: assertion_pass
      verification_notes: Run `rustc compliant.rs && ./compliant`; expected result
        is zero panics and successful exit. Reviewers can check that each required
