version: 2
suite_id: core_docs_table1_retrieval_eval_v2
description: >-
  API-first retrieval evaluation suite for Rust core docs with target-aware metadata.
  Includes safety-critical platform overlays and hard-negative abstain prompts.

prompts:
  # Ergonomics (5)
  - prompt_id: CORE-ERG-001
    category: ergonomics
    slice: issue_identification
    query_text: When should I use Option::ok_or_else instead of ok_or?
    semantic_focus: true
    modes: [lexical, semantic, hybrid]
    expected_row_markers: [1d]
    relevant_terms: [option, ok_or_else, ok_or, lazy, error]
    expected_item_kinds: [method, enum]
    required_evidence_fields: [item_path, signature, panic_behavior]
    target_scope: any
    expect_abstain: false

  - prompt_id: CORE-ERG-002
    category: ergonomics
    slice: issue_identification
    query_text: How do I convert Option to Result without constructing errors eagerly?
    semantic_focus: true
    modes: [lexical, semantic, hybrid]
    expected_row_markers: [1d]
    relevant_terms: [option, result, ok_or_else, lazy, conversion]
    expected_item_kinds: [method, enum]
    required_evidence_fields: [item_path, signature, example_snippets]
    target_scope: any
    expect_abstain: false

  - prompt_id: CORE-ERG-003
