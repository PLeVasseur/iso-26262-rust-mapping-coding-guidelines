version: 1
suite_id: rust_reference_table1_retrieval_eval_ws3_main_v1
description: >-
  WS3 main-eval prompt set for rust_reference retrieval quality recovery.
  Includes mechanism-anchored positives and hard negatives.

prompts:
  - prompt_id: WS3-ISSUE-001
    slice: issue_identification
    query_text: Which Rust error-path patterns around Result and Option can hide failures when defensive checks are missing?
    semantic_focus: true
    modes: [lexical, semantic, hybrid]
    expected_row_markers: [1d]
    relevant_terms: [result, option, error, panic, defensive]

  - prompt_id: WS3-ISSUE-002
    slice: issue_identification
    query_text: Where do weak type boundaries with struct or enum design allow incorrect states to pass checks?
    semantic_focus: true
    modes: [lexical, semantic, hybrid]
    expected_row_markers: [1c]
    relevant_terms: [type, struct, enum, invariant]

  - prompt_id: WS3-ISSUE-003
    slice: issue_identification
    query_text: What concurrency hazards arise when Send and Sync assumptions are wrong across thread boundaries?
    semantic_focus: true
    modes: [lexical, semantic, hybrid]
    expected_row_markers: [1h]
    relevant_terms: [send, sync, thread, race, atomic]

  - prompt_id: WS3-ISSUE-004
    slice: issue_identification
    query_text: Which unsafe boundary mistakes break invariants when unsafe fn or unsafe trait contracts are violated?
    semantic_focus: true
    modes: [lexical, semantic, hybrid]
    expected_row_markers: [1f]
    relevant_terms: [unsafe, boundary, invariant, unsafe fn, unsafe trait]

  - prompt_id: WS3-ISSUE-005
    slice: issue_identification
    query_text: How can borrow and lifetime misuse create latent memory-safety faults in safety-critical Rust code?
    semantic_focus: true
    modes: [lexical, semantic, hybrid]
    expected_row_markers: [1e]
    relevant_terms: [borrow, borrowing, lifetime, ownership, memory]

  - prompt_id: WS3-ISSUE-006
    slice: issue_identification
    query_text: What verification risks appear when lint and warning diagnostics are disabled or ignored?
    semantic_focus: true
    modes: [lexical, semantic, hybrid]
    expected_row_markers: [1i]
    relevant_terms: [diagnostic, lint, warning, verification]

  - prompt_id: WS3-ISSUE-007
    slice: issue_identification
    query_text: Which trait and abstraction choices can weaken architecture integrity for safety requirements?
    semantic_focus: true
    modes: [lexical, semantic, hybrid]
    expected_row_markers: [1a]
    relevant_terms: [trait, abstraction, interface, architecture]

  - prompt_id: WS3-ISSUE-008
    slice: issue_identification
    query_text: Where can non-exhaustive match handling create ambiguous control-flow behavior?
    semantic_focus: true
    modes: [lexical, semantic, hybrid]
    expected_row_markers: [1b]
    relevant_terms: [match, pattern, exhaustive, branch]

  - prompt_id: WS3-ISSUE-009
    slice: issue_identification
    query_text: How do inconsistent style and lint conventions reduce analyzability in audits?
    semantic_focus: false
    modes: [lexical, semantic, hybrid]
    expected_row_markers: [1g]
    relevant_terms: [style, guide, lint, analyzability]

  - prompt_id: WS3-ISSUE-010
    slice: issue_identification
    query_text: Which subset-rule violations increase diagnostic blind spots and reduce review confidence?
    semantic_focus: true
    modes: [lexical, semantic, hybrid]
    expected_row_markers: [1i]
    relevant_terms: [subset, restriction, diagnostic, review]

  - prompt_id: WS3-RESOLVE-001
    slice: resolution_identification
    query_text: Which Result and Option handling patterns provide robust defensive error paths?
    semantic_focus: true
    modes: [lexical, semantic, hybrid]
    expected_row_markers: [1d]
    relevant_terms: [result, option, error, defensive]

  - prompt_id: WS3-RESOLVE-002
    slice: resolution_identification
    query_text: Which Rust type-system mechanisms prevent invalid states at compile time?
    semantic_focus: true
    modes: [lexical, semantic, hybrid]
    expected_row_markers: [1c]
    relevant_terms: [type, struct, enum, invariant]

  - prompt_id: WS3-RESOLVE-003
    slice: resolution_identification
    query_text: How do ownership and explicit lifetime rules mitigate memory safety concerns?
    semantic_focus: true
    modes: [lexical, semantic, hybrid]
    expected_row_markers: [1e]
    relevant_terms: [ownership, borrowing, lifetime, memory]

  - prompt_id: WS3-RESOLVE-004
    slice: resolution_identification
    query_text: What review practices keep unsafe code boundaries explicit and controlled?
    semantic_focus: true
    modes: [lexical, semantic, hybrid]
    expected_row_markers: [1f]
    relevant_terms: [unsafe, boundary, review, invariant]

  - prompt_id: WS3-RESOLVE-005
    slice: resolution_identification
    query_text: Which Send and Sync constraints are used to prevent cross-thread race conditions?
    semantic_focus: true
    modes: [lexical, semantic, hybrid]
    expected_row_markers: [1h]
    relevant_terms: [send, sync, thread, atomic, race]

  - prompt_id: WS3-RESOLVE-006
