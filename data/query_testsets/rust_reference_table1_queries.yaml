version: 1
suite_id: rust_reference_table1_reasonableness_v1
description: >-
  Fixed 45-case query reasonableness suite for ISO 26262 Part 6 Table 1.
  Five query intents are executed for each row marker (1a..1i).
source_database: rust_reference.sqlite

rows:
  - row_marker: 1a
    cases:
      - case_id: RR-1A-Q1
        query_type: row_verdict
        query_id: row_verdicts_for_table1
        purpose: Verify row verdict exists and is in allowed domain
      - case_id: RR-1A-Q2
        query_type: rationale_anchor_timestamp
        query_id: row_verdicts_for_table1
        purpose: Verify row rationale anchor and timestamp are populated
      - case_id: RR-1A-Q3
        query_type: mechanisms_for_row
        query_id: mechanisms_for_row
        purpose: Verify ranked mechanisms are returned for the row
      - case_id: RR-1A-Q4
        query_type: lexical_statement_search
        query_id: lexical_statement_hits_for_row
        params:
          term_a: trait
          term_b: type
          term_c: interface
        purpose: Verify lexical statement hits for row-related mechanisms
      - case_id: RR-1A-Q5
        query_type: top_mechanism_evidence
        query_id: evidence_for_mechanism
        purpose: Verify evidence quality for top-ranked row mechanism

